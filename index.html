<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>空洞騎士・主線劇情流程</title>
<style>
:root{--bg:#0b0f14;--panel:#121820;--line:#1e2a38;--text:#dce6f0;--mute:#8aa0b5;--accent:#7ec8ff;--gold:#e8c47c;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55}
header{padding:28px 24px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101820,#0b0f14)}
header h1{font-size:22px;letter-spacing:.08em;color:var(--gold);font-weight:600}
header p{margin-top:8px;color:var(--mute);font-size:14px;max-width:720px}
header a{color:var(--accent)}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 110px)}
nav{border-right:1px solid var(--line);padding:16px 12px;background:#0e131a;position:sticky;top:0;height:100vh;overflow:auto}
nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--mute);padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;margin-bottom:4px}
nav button:hover,nav button.active{background:#182230;color:var(--text)}
nav button.active{border-left:3px solid var(--accent);padding-left:9px}
nav .n{color:var(--accent);font-size:11px;margin-right:6px}
main{padding:20px 24px 48px}
.card{display:none;max-width:900px}
.card.on{display:block}
.card img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
.meta{margin:14px 0 8px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:#182230;color:var(--accent);border:1px solid #243446}
.card h2{font-size:20px;margin:6px 0 10px;color:#fff}
.card .place{color:var(--gold);font-size:13px;margin-bottom:10px}
.card p{color:#c5d2e0;font-size:15px}
.navrow{display:flex;gap:10px;margin-top:22px}
.navrow button{background:#1a2736;color:#fff;border:1px solid #2c3e50;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit}
.navrow button:hover{background:#243447}
.spoiler{margin-top:18px;font-size:12px;color:var(--mute)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow:auto;white-space:nowrap;border-right:0;border-bottom:1px solid var(--line)}nav button{display:inline-block;width:auto}}
</style>
</head>
<body>
<header>
  <h1>空洞騎士・主線劇情流程</h1>
  <p>依常見首通路線整理的章節流程（含能力解鎖），配 Steam 商店公開截圖。劇情為摘要，避免大結局劇透。正版：<a href="https://store.steampowered.com/app/367520/Hollow_Knight/" target="_blank" rel="noopener">Steam 商店頁</a></p>
</header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>

const chapters = [{"id": "c0", "title": "序章・墜入聖巢", "place": "國王小徑 → 塵土之口", "unlock": "開始旅程", "img": "header.jpg", "body": "小騎士（The Knight）從王國之外墜入聖巢（Hallownest）。穿過國王小徑後，來到地表小鎮塵土之口（Dirtmouth），再由水井墜入遺忘十字路。"}, {"id": "c1", "title": "第一章・遺忘十字路", "place": "Forgotten Crossroads", "unlock": "復仇之魂、地圖與羽毛筆", "img": "shot00.jpg", "body": "探索十字路、找製圖師 Cornifer、救出 Sly。在先祖之丘取得第一個咒術「復仇之魂」，並擊敗虛假騎士（False Knight）。"}, {"id": "c2", "title": "第二章・蒼綠之路", "place": "Greenpath", "unlock": "蛾翼披風（衝刺）", "img": "shot01.jpg", "body": "西行進入蒼綠之路。與大黃蜂（Hornet）初次交手後，取得蛾翼披風，之後才能暢通多數區域。此處也會短暫見到三位守夢人的投影。"}, {"id": "c3", "title": "第三章・真菌荒地", "place": "Fungal Wastes / Mantis Village", "unlock": "螳螂爪（蹬牆跳）", "img": "shot02.jpg", "body": "南下真菌荒地，挑戰螳螂領主。取得螳螂爪後，可回頭清掃先前夠不到的路線，王國地圖真正打開。"}, {"id": "c4", "title": "第四章・淚水之城", "place": "City of Tears", "unlock": "荒蕪俯衝、尖銳之釘", "img": "shot03.jpg", "body": "帶著城徽進入淚水之城。靈魂聖所擊敗靈魂大師取得荒蕪俯衝；可找釘匠升級武器，並認識收藏家 Lemm。"}, {"id": "c5", "title": "第五章・水晶與安息", "place": "Crystal Peak → Resting Grounds", "unlock": "水晶之心、夢之釘", "img": "shot04.jpg", "body": "爬上水晶山峰取得水晶之心（超衝），再南下安息之地。先知授予夢之釘——之後才能讀取低語之根、挑戰戰士之夢，並打破守夢封印。"}, {"id": "c6", "title": "第六章・深域與雙翼", "place": "Ancient Basin / Kingdom's Edge / Deepnest", "unlock": "帝王之翼、暗影披風等", "img": "shot05.jpg", "body": "古代盆地取得帝王之翼（二段跳）；王國邊緣再戰大黃蜂；深巢等區域可取得關鍵移動能力。路線彈性變大，可依能力自由探索。"}, {"id": "c7", "title": "第七章・三位守夢人", "place": "Fog Canyon / City Spire / Deepnest", "unlock": "打破黑卵三封印", "img": "shot08.jpg", "body": "用夢之釘分別進入三位守夢人的夢境並擊敗他們：教師莫諾蒙（Monomon）、守望者盧里恩（Lurien）、野獸赫拉（Herrah）。三人皆敗後，黑卵神殿的封印才會開啟。"}, {"id": "c8", "title": "終章・黑卵神殿", "place": "Temple of the Black Egg", "unlock": "空洞騎士戰與多種結局", "img": "shot10.jpg", "body": "回到遺忘十字路的黑卵神殿，挑戰被封印的空洞騎士。依是否完成夢境首領、虛空之心等條件，會走向不同結局（含光輝相關路線）。此頁只標流程，不劇透結局細節。"}];

chapters.forEach((c,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.innerHTML='<span class="n">'+(i+1)+'</span>'+c.title.replace(/^.*?・/,'');
  b.onclick=()=>show(i);
  nav.appendChild(b);
  const card=document.createElement('section');
  card.className='card'+(i===0?' on':'');
  card.id='card'+i;
  card.innerHTML=`
    <img alt="${c.title}" src="data:image/jpeg;base64,${imgs[c.img]}"/>
    <div class="meta"><span class="tag">${c.unlock}</span></div>
    <div class="place">${c.place}</div>
    <h2>${c.title}</h2>
    <p>${c.body}</p>
    <div class="navrow">
      <button type="button" ${i===0?'disabled':''} onclick="show(${i-1})">上一章</button>
      <button type="button" ${i===chapters.length-1?'disabled':''} onclick="show(${i+1})">下一章</button>
    </div>
    <p class="spoiler">圖片來源：Steam 商店公開素材（app 367520）。劇情為流程摘要，非遊戲原文。</p>`;
  main.appendChild(card);
});
function show(i){
  if(i<0||i>=chapters.length)return;
  document.querySelectorAll('.card').forEach((el,idx)=>el.classList.toggle('on',idx===i));
  document.querySelectorAll('#nav button').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('#nav button')[0].classList.add('active');
</script>
</body>
</html>
